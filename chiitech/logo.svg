<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ChiiTech monogram: bold C with a T locked into its opening. Black background, white mark, no text. -->
  <rect width="512" height="512" rx="96" fill="#000000"/>

  <!-- Bold C arc, open to the right -->
  <path d="M 356 118 A 148 148 0 1 0 356 394"
        fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="butt"/>

  <!-- T bar: top bar spans the C opening -->
  <rect x="264" y="146" width="182" height="56" rx="10" fill="#ffffff"/>
  <!-- T stem: descends from the bar, centered in the gap -->
  <rect x="327" y="202" width="56" height="164" rx="10" fill="#ffffff"/>

  <!-- Dot accents suggesting "ii" of Chii — one solid, one outlined -->
  <circle cx="196" cy="168" r="26" fill="#ffffff"/>
  <circle cx="196" cy="246" r="26" fill="#000000" stroke="#ffffff" stroke-width="10"/>
</svg>
